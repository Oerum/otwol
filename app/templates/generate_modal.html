<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wake On LAN tool to manage and wake computers on your network.">
    <title>OTWOL - Action Result</title>
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.svg') }}"/>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/fontawesome/css/fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/fontawesome/css/brands.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/fontawesome/css/solid.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='assets/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  </head>
  <body>
    
    <!-- Hidden theme toggle nodes for darkmode.js compatibility -->
    <div style="display: none;">
      <div id="darkModeBtn"></div>
      <input type="checkbox" id="darkModeSwitch">
    </div>

    <!-- Modal -->
    <div class="modal fade" id="messageModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="messageModalLabel">{{ title }}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-4">
            <div class="d-flex align-items-start gap-3">
              <div class="text-primary" style="font-size: 24px;">
                <i class="fa-solid fa-circle-info"></i>
              </div>
              <div class="flex-grow-1" style="font-size: 14px; line-height: 1.6; color: var(--stripe-text-primary);">
                {{ message_content|safe }}
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-stripe-primary w-100 justify-content-center" id="closeModalButton">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  
    <script>
      // Show the modal when the page loads
      var myModal = new bootstrap.Modal(document.getElementById('messageModal'));
      myModal.show();
  
      // Redirect to root index when the close button is clicked
      document.getElementById('closeModalButton').addEventListener('click', function() {
          window.history.back();
      });
  
      // Redirect to root index when the modal is closed (backdrop click or escape key)
      document.getElementById('messageModal').addEventListener('hidden.bs.modal', function () {
          window.history.back();
      });
    </script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
  </body>
</html>
